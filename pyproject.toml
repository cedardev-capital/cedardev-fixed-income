[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[project]
name        = "cedardev-fixed-income"
version     = "1.0.1"
description = "Fixed Income Risk Analytics — US Treasuries, Agency MBS, Treasury Futures, VaR, Margining (SEC Rule 4210)"
readme      = "README.md"
license     = { file = "LICENSE" }
authors     = [
    { name = "CedarDev Capital Management LLC", email = "quant@cedardev-capital.com" },
]
maintainers = [
    { name = "CedarDev Capital Management LLC", email = "quant@cedardev-capital.com" },
]
keywords = [
    "fixed-income", "treasury", "bonds", "MBS", "mortgage-backed-securities",
    "duration", "dv01", "convexity", "var", "value-at-risk", "margin",
    "sec-rule-4210", "quantitative-finance", "risk-analytics",
    "yield-curve", "zero-curve", "futures", "ctd",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
requires-python = ">=3.11"

dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pydantic>=2.0.0",
    "tabulate>=0.9.0",
    "colorlog>=6.7.0",
    "snowflake-connector-python>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "hatchling>=1.21.0",
    "twine>=5.0.0",
    "build>=1.1.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.24.0",
]

[project.urls]
Homepage      = "https://github.com/cedardev-capital/cedardev-fixed-income"
Documentation = "https://cedardev-capital.github.io/cedardev-fixed-income"
Repository    = "https://github.com/cedardev-capital/cedardev-fixed-income"
Issues        = "https://github.com/cedardev-capital/cedardev-fixed-income/issues"
Changelog     = "https://github.com/cedardev-capital/cedardev-fixed-income/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["cedardev"]

[tool.hatch.build.targets.sdist]
include = [
    "/cedardev",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
]

# ── Ruff (linter + formatter) ─────────────────────────────────────────────────
[tool.ruff]
line-length    = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "ANN"]
ignore = ["ANN101", "ANN102", "E501"]

# ── mypy (type checker) ───────────────────────────────────────────────────────
[tool.mypy]
python_version         = "3.11"
strict                 = false
ignore_missing_imports = true
warn_return_any        = true
warn_unused_ignores    = true

# ── pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths       = ["tests"]
addopts         = "-v --tb=short --cov=cedardev --cov-report=term-missing"
filterwarnings  = ["ignore::DeprecationWarning"]
